<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
<rect width="1120" height="780" fill="#FFF9F2"/>
<text x="60" y="52" font-size="30" fill="#2B1A0E">你卡在哪一步？—— 一句话就能定阶段</text>

<!-- 问 1 -->
<rect x="60" y="90" width="330" height="150" rx="16" fill="#FFFFFF" stroke="#E9D8C8" stroke-width="3"/>
<text x="225.0" y="132.0" font-size="22" fill="#2B1A0E" text-anchor="middle" font-weight="bold">
<tspan x="225.0" dy="0.0">你现在卡在哪一步？</tspan>
</text>
<text x="225.0" y="172.0" font-size="19" fill="#6B5545" text-anchor="middle">
<tspan x="225.0" dy="0.0">A 不知道下一步该做什么</tspan>
</text>
<text x="225.0" y="207.0" font-size="19" fill="#6B5545" text-anchor="middle">
<tspan x="225.0" dy="0.0">B 有方向，不知选哪个切口</tspan>
</text>

<!-- A 启发思路 -->
<rect x="560" y="90" width="500" height="110" rx="16" fill="#F5B482" stroke="#C97B3F" stroke-width="3"/>
<text x="810.0" y="132.2" font-size="25" fill="#2B1A0E" text-anchor="middle">
<tspan x="810.0" dy="0.0">启发思路</tspan>
<tspan x="810.0" dy="33.0">往外扩：别人的什么能搬过来</tspan>
</text>
<line x1="390.0" y1="172.0" x2="560.0" y2="145.0" stroke="#C97B3F" stroke-width="3.5"/>
<rect x="452.0" y="141.6" width="44.0" height="31.5" fill="#FFF9F2"/>
<text x="474.0" y="165.1" font-size="21" fill="#C97B3F" text-anchor="middle">A</text>
<polygon points="560.0,145.0 544.0,139.0 544.0,151.0" fill="#C97B3F"/>

<!-- B 选题中 -->
<rect x="560" y="230" width="500" height="110" rx="16" fill="#F5B482" stroke="#C97B3F" stroke-width="3"/>
<text x="810.0" y="272.2" font-size="25" fill="#2B1A0E" text-anchor="middle">
<tspan x="810.0" dy="0.0">选题中</tspan>
<tspan x="810.0" dy="33.0">往里收：哪块值得挖、别人还没占</tspan>
</text>
<line x1="390.0" y1="207.0" x2="560.0" y2="285.0" stroke="#C97B3F" stroke-width="3.5"/>
<rect x="452.0" y="229.6" width="44.0" height="31.5" fill="#FFF9F2"/>
<text x="474.0" y="253.1" font-size="21" fill="#C97B3F" text-anchor="middle">B</text>
<polygon points="560.0,285.0 544.0,279.0 544.0,291.0" fill="#C97B3F"/>

<!-- C → 问 2 -->
<line x1="225.0" y1="240.0" x2="225.0" y2="380.0" stroke="#C97B3F" stroke-width="3.5"/>
<rect x="196.0" y="288.0" width="58.0" height="31.5" fill="#FFF9F2"/>
<text x="225.0" y="311.5" font-size="21" fill="#C97B3F" text-anchor="middle">C</text>
<polygon points="225.0,380.0 231.0,364.0 219.0,364.0" fill="#C97B3F"/>

<!-- 问 2 -->
<rect x="60" y="380" width="330" height="160" rx="16" fill="#FFFFFF" stroke="#E9D8C8" stroke-width="3"/>
<text x="225.0" y="420.0" font-size="22" fill="#2B1A0E" text-anchor="middle" font-weight="bold">
<tspan x="225.0" dy="0.0">C 已经定了具体题目</tspan>
<tspan x="225.0" dy="33.0">实验开题了吗？</tspan>
</text>
<text x="225.0" y="492.0" font-size="19" fill="#6B5545" text-anchor="middle">
<tspan x="225.0" dy="0.0">还在设计 · 已经在做</tspan>
</text>

<!-- 定题设计实验 -->
<rect x="560" y="380" width="500" height="110" rx="16" fill="#F5B482" stroke="#C97B3F" stroke-width="3"/>
<text x="810.0" y="422.2" font-size="25" fill="#2B1A0E" text-anchor="middle">
<tspan x="810.0" dy="0.0">定题设计实验</tspan>
<tspan x="810.0" dy="33.0">前人工作 · 类似思路 · 方法可复用</tspan>
</text>
<line x1="390.0" y1="432.0" x2="560.0" y2="435.0" stroke="#C97B3F" stroke-width="3.5"/>
<rect x="409.2" y="416.6" width="101.7" height="31.5" fill="#FFF9F2"/>
<text x="460.0" y="440.1" font-size="21" fill="#C97B3F" text-anchor="middle">还在设计</text>
<polygon points="560.0,435.0 544.0,429.0 544.0,441.0" fill="#C97B3F"/>

<!-- 已开题未结题 -->
<rect x="560" y="520" width="500" height="110" rx="16" fill="#E26D4E" stroke="#B2452C" stroke-width="3"/>
<text x="810.0" y="562.2" font-size="25" fill="#FFF9F2" text-anchor="middle">
<tspan x="810.0" dy="0.0">已开题未结题（防抢发）</tspan>
<tspan x="810.0" dy="33.0">谁可能已经抢在你前面发文</tspan>
</text>
<line x1="390.0" y1="492.0" x2="560.0" y2="575.0" stroke="#C97B3F" stroke-width="3.5"/>
<rect x="409.2" y="518.6" width="101.7" height="31.5" fill="#FFF9F2"/>
<text x="460.0" y="542.1" font-size="21" fill="#C97B3F" text-anchor="middle">已经在做</text>
<polygon points="560.0,575.0 544.0,569.0 544.0,581.0" fill="#C97B3F"/>

<!-- 底部说明 -->
<rect x="60" y="668" width="1000" height="80" rx="14" fill="#FFF1E6" stroke="#E9D8C8" stroke-width="2"/>
<text x="560.0" y="702.0" font-size="19" fill="#6B5545" text-anchor="middle">
<tspan x="560.0" dy="0.0">「有没有前期积累」要单独问一句，但它不决定阶段：</tspan>
<tspan x="560.0" dy="28.0">任何领域的积累都算（交叉最有用）；有积累也可能不知道下一步做什么，零积累也可能已经定了方向。</tspan>
</text>
</svg>
